<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A pixel koi pond. Tap the water to make ripples, or turn on food to feed the koi.">
<meta name="theme-color" content="#0f3a3a">
<style>[hidden]{display:none!important}</style>
<title>Koi Pond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* Layout: the whole window is the pond. Two round controls float at the corners and fade when idle;
   settings open as a small panel over the water. One deliberate dark look: it's a pond. */
:root {
  --water: #0f3a3a;
  --ink: #f3efe6;
  --muted: #a9c4bb;
  --panel: rgba(5, 20, 21, 0.9);
  --line: rgba(191, 227, 214, 0.22);
  --accent: #f2d58a;
  --pixel: "Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--water);
  color: var(--ink);
  font-family: var(--pixel);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
#pond {
  position: fixed;
  left: 0;
  top: 0;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  cursor: pointer;
}

/* ---- floating controls ---- */
.ctl {
  position: fixed;
  z-index: 2;
  transition: opacity 0.7s ease;
}
#settingsBtn {
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: calc(14px + env(safe-area-inset-right, 0px));
}
#fsBtn {
  top: calc(14px + env(safe-area-inset-top, 0px));
  left: calc(14px + env(safe-area-inset-left, 0px));
}
#fsBtn .fs-exit { display: none; }
#fsBtn[aria-pressed="true"] .fs-exit { display: block; }
#fsBtn[aria-pressed="true"] .fs-enter { display: none; }
#soundBtn {
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  left: calc(14px + env(safe-area-inset-left, 0px));
}
#soundBtn .waves { display: none; }
#soundBtn[aria-pressed="true"] .waves { display: block; }
#soundBtn[aria-pressed="true"] .mute { display: none; }
#soundBtn[aria-pressed="true"] { border-color: var(--accent); }
#foodBtn {
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  right: calc(14px + env(safe-area-inset-right, 0px));
}
body.idle .ctl { opacity: 0; pointer-events: none; }
.round {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--panel);
  border: 2px solid var(--line);
  color: var(--ink);
  cursor: pointer;
  padding: 0;
}
.round svg { width: 28px; height: 28px; shape-rendering: crispEdges; }
#foodBtn[aria-pressed="true"] { border-color: var(--accent); }
#foodBtn .off-mark { display: block; }
#foodBtn[aria-pressed="true"] .off-mark { display: none; }
#foodBtn .crumbs { display: none; }
#foodBtn[aria-pressed="true"] .crumbs { display: block; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* ---- toast & first-visit hint ---- */
#toast, #hint {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  pointer-events: none;
  text-align: center;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.6);
  transition: opacity 0.6s ease;
  white-space: nowrap;
}
#toast {
  top: calc(20px + env(safe-area-inset-top, 0px));
  font-size: 16px;
  letter-spacing: 0.08em;
  opacity: 0;
}
#toast.show { opacity: 1; transition: none; }
#hint {
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  font-size: 13px;
  line-height: 1.7;
  letter-spacing: 0.06em;
  color: var(--muted);
}
#hint.gone { opacity: 0; }

/* ---- settings panel ---- */
#panel {
  position: fixed;
  z-index: 3;
  top: calc(76px + env(safe-area-inset-top, 0px));
  right: calc(14px + env(safe-area-inset-right, 0px));
  width: min(300px, calc(100vw - 28px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  max-height: calc(100% - 100px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  box-sizing: border-box;
  padding: 16px 18px 18px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 6px;
  display: grid;
  gap: 16px;
  backdrop-filter: blur(2px);
}
#panel[hidden] { display: none; }
.view { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.view > * { min-width: 0; }
.view[hidden] { display: none; }

/* paint my koi */
.paintbtn {
  display: flex;
  align-items: center;
  gap: 10px;
  font: inherit;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px 10px;
  cursor: pointer;
  text-align: left;
}
.paintbtn span:nth-of-type(1) { flex: 1; }
#paintPreview { width: 60px; height: 18px; image-rendering: pixelated; flex: none; }
#painterCanvas {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
.partnav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#partName { font-size: 14px; letter-spacing: 0.1em; }
.swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.swatches button {
  aspect-ratio: 1;
  border-radius: 3px;
  border: 2px solid rgba(0, 0, 0, 0.35);
  padding: 0;
  cursor: pointer;
}
.swatches button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(242, 213, 138, 0.35); }
.painter-actions { display: flex; justify-content: space-between; gap: 8px; }
.textbtn.primary { color: var(--ink); border-color: var(--accent); }
#panel header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#panel h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.1em;
}
.textbtn {
  font: inherit;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--muted);
  background: none;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 10px;
  cursor: pointer;
}
.field { display: grid; gap: 8px; }
.field > label, .field > .label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.field output { color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
select {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px;
}
select option { background: #0a2223; color: var(--ink); }
.choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.choices.three { grid-template-columns: repeat(3, 1fr); }
.choices.two { grid-template-columns: repeat(2, 1fr); }
.choice {
  font: inherit;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.05);
  border: 2px solid transparent;
  border-radius: 4px;
  padding: 8px 2px;
  cursor: pointer;
}
.choice[aria-pressed="true"] { border-color: var(--accent); }
.swatch {
  height: 30px;
  border-radius: 3px;
  margin-bottom: 6px;
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.keys {
  margin: 0;
  font-size: 11px;
  line-height: 1.8;
  letter-spacing: 0.05em;
  color: var(--muted);
}
@media (prefers-reduced-motion: reduce) {
  .ctl, #toast, #hint { transition: none; }
}
</style>
</head>
<body>
<canvas id="pond" aria-label="A koi pond. Tap the water to make ripples, or turn on food to feed the koi."></canvas>

<button class="ctl round" id="settingsBtn" aria-label="Pond settings" aria-expanded="false" aria-controls="panel">
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <rect x="2" y="3" width="10" height="1" fill="currentColor"/><rect x="8" y="2" width="2" height="3" fill="currentColor"/>
    <rect x="2" y="7" width="10" height="1" fill="currentColor"/><rect x="4" y="6" width="2" height="3" fill="currentColor"/>
    <rect x="2" y="11" width="10" height="1" fill="currentColor"/><rect x="9" y="10" width="2" height="3" fill="currentColor"/>
  </svg>
</button>

<button class="ctl round" id="fsBtn" aria-label="Full screen" aria-pressed="false" hidden>
  <svg viewBox="0 0 14 14" aria-hidden="true" fill="currentColor">
    <g class="fs-enter">
      <rect x="1" y="1" width="4" height="1"/><rect x="1" y="1" width="1" height="4"/>
      <rect x="9" y="1" width="4" height="1"/><rect x="12" y="1" width="1" height="4"/>
      <rect x="1" y="12" width="4" height="1"/><rect x="1" y="9" width="1" height="4"/>
      <rect x="9" y="12" width="4" height="1"/><rect x="12" y="9" width="1" height="4"/>
    </g>
    <g class="fs-exit">
      <rect x="1" y="4" width="4" height="1"/><rect x="4" y="1" width="1" height="4"/>
      <rect x="9" y="4" width="4" height="1"/><rect x="9" y="1" width="1" height="4"/>
      <rect x="1" y="9" width="4" height="1"/><rect x="4" y="9" width="1" height="4"/>
      <rect x="9" y="9" width="4" height="1"/><rect x="9" y="9" width="1" height="4"/>
    </g>
  </svg>
</button>

<button class="ctl round" id="soundBtn" aria-label="Sound on" aria-pressed="false">
  <svg viewBox="0 0 14 14" aria-hidden="true" fill="currentColor">
    <rect x="1" y="5" width="3" height="4"/><rect x="4" y="4" width="1" height="6"/><rect x="5" y="3" width="1" height="8"/><rect x="6" y="2" width="1" height="10"/>
    <g class="waves"><rect x="9" y="5" width="1" height="4"/><rect x="11" y="3" width="1" height="8"/><rect x="10" y="4" width="1" height="1"/><rect x="10" y="9" width="1" height="1"/></g>
    <g class="mute"><rect x="9" y="5" width="1" height="1"/><rect x="10" y="6" width="1" height="1"/><rect x="11" y="7" width="1" height="1"/><rect x="12" y="8" width="1" height="1"/><rect x="12" y="5" width="1" height="1"/><rect x="11" y="6" width="1" height="1"/><rect x="10" y="7" width="1" height="1"/><rect x="9" y="8" width="1" height="1"/></g>
  </svg>
</button>

<button class="ctl round" id="foodBtn" aria-label="Food" aria-pressed="false">
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <g class="crumbs" fill="#ebc07e"><rect x="3" y="1" width="1" height="1"/><rect x="7" y="0" width="1" height="1"/><rect x="10" y="2" width="1" height="1"/></g>
    <rect x="5" y="4" width="4" height="1" fill="#a8733f"/>
    <rect x="6" y="5" width="2" height="1" fill="#6e4a28"/>
    <rect x="4" y="6" width="6" height="1" fill="#a8733f"/>
    <rect x="3" y="7" width="8" height="4" fill="#a8733f"/>
    <rect x="4" y="11" width="6" height="1" fill="#a8733f"/>
    <rect x="4" y="8" width="2" height="2" fill="#c08a52"/>
    <g class="off-mark" fill="#e8e2d6"><rect x="2" y="12" width="1" height="1"/><rect x="3" y="11" width="1" height="1"/><rect x="10" y="3" width="1" height="1"/><rect x="11" y="2" width="1" height="1"/></g>
  </svg>
</button>

<div id="toast" role="status" aria-live="polite"></div>
<div id="hint">tap the water<br>turn on food to feed the koi</div>

<section id="panel" role="dialog" aria-label="Pond settings" hidden>
  <header>
    <h2 id="panelTitle">pond</h2>
    <button class="textbtn" id="closeBtn">close</button>
  </header>

  <div class="view" id="paintView" hidden>
    <canvas id="painterCanvas" width="72" height="30" aria-label="Your koi. Tap a part of the fish to choose it."></canvas>
    <div class="partnav">
      <button class="textbtn" id="partPrev" aria-label="Previous part">&lt;</button>
      <span id="partName" aria-live="polite">head</span>
      <button class="textbtn" id="partNext" aria-label="Next part">&gt;</button>
    </div>
    <div class="swatches" id="swatches" role="group" aria-label="Color for this part"></div>
    <div class="painter-actions">
      <button class="textbtn" id="paintReset">start over</button>
      <button class="textbtn primary" id="paintDone">done</button>
    </div>
  </div>

  <div class="view" id="mainView">
  <div class="field">
    <label for="volume">volume <output id="volumeOut" for="volume">6</output></label>
    <input type="range" id="volume" min="1" max="10" step="1" value="6">
  </div>

  <div class="field">
    <label for="count">number of koi <output id="countOut" for="count">7</output></label>
    <input type="range" id="count" min="1" max="20" step="1" value="7">
  </div>

  <div class="field">
    <label for="colors">koi colors</label>
    <select id="colors">
      <option value="mixed">mixed</option>
      <option value="mix">mix with mine</option>
      <option value="custom">only mine</option>
      <option value="0">red + white</option>
      <option value="1">tancho</option>
      <option value="2">showa</option>
      <option value="3">sanke</option>
      <option value="4">gold</option>
      <option value="5">orange</option>
      <option value="6">platinum</option>
    </select>
    <button class="paintbtn" id="paintOpen">
      <canvas id="paintPreview" width="40" height="12" aria-hidden="true"></canvas>
      <span>paint my koi</span><span aria-hidden="true">&gt;</span>
    </button>
  </div>

  <div class="field">
    <label for="speed">swim speed <output id="speedOut" for="speed">5</output></label>
    <input type="range" id="speed" min="1" max="10" step="1" value="5">
  </div>

  <div class="field">
    <span class="label" id="waterLabel">water</span>
    <div class="choices" id="water" role="group" aria-labelledby="waterLabel"></div>
  </div>

  <div class="field">
    <span class="label" id="padsLabel">lily pads</span>
    <div class="choices three" id="pads" role="group" aria-labelledby="padsLabel"></div>
  </div>

  <div class="field">
    <span class="label" id="weatherLabel">weather <output id="weatherNow"></output></span>
    <div class="choices three" id="weather" role="group" aria-labelledby="weatherLabel"></div>
  </div>

  <div class="field">
    <span class="label" id="visitorsLabel">frog and dragonfly</span>
    <div class="choices two" id="visitors" role="group" aria-labelledby="visitorsLabel"></div>
  </div>

  <p class="keys">keys: f or space = food<br>m = sound<br>s = settings<br>enter = full screen<br>rest the mouse on the water and the koi come to look</p>
  </div>
</section>

<script>
(() => {
  // ---------------- palettes (same as the Sidephone app) ----------------
  const WATERS = [
    { name: "teal",      c: [0x0A2A2C, 0x0F3A3A, 0x144A46, 0x1B5C54, 0x267062, 0x3A8774] },
    { name: "night",     c: [0x03060F, 0x060B19, 0x091124, 0x0D182F, 0x12203B, 0x1A2B4A] },
    { name: "deep blue", c: [0x071A31, 0x0B2543, 0x103257, 0x16416D, 0x1F5285, 0x2E679C] },
    { name: "jade",      c: [0x0E281B, 0x133624, 0x19462F, 0x21573A, 0x2C6946, 0x3E7E56] },
  ];
  const NIGHT = 1;
  const WHITE = 0xF3EFE6, RED = 0xE2471F, ORANGE = 0xF28A22, BLACK = 0x231E1C,
        GOLD = 0xF5C04A, CREAM = 0xF7DDA6, PLATINUM = 0xDCE3E3;
  const PATTERNS = [
    [WHITE, RED, RED, WHITE, RED, RED, WHITE, WHITE],        // kohaku (red + white)
    [WHITE, RED, WHITE, WHITE, WHITE, WHITE, WHITE, WHITE],  // tancho
    [BLACK, RED, WHITE, BLACK, RED, BLACK, WHITE, BLACK],    // showa
    [WHITE, RED, WHITE, RED, BLACK, WHITE, RED, WHITE],      // sanke
    [GOLD, GOLD, GOLD, GOLD, GOLD, GOLD, CREAM, CREAM],      // gold
    [ORANGE, ORANGE, ORANGE, ORANGE, ORANGE, ORANGE, ORANGE, CREAM], // orange
    [PLATINUM, PLATINUM, PLATINUM, PLATINUM, PLATINUM, PLATINUM, WHITE, WHITE], // platinum
  ];
  // colors offered in "paint my koi"
  const PALETTE = [
    [WHITE, "white"], [CREAM, "cream"], [PLATINUM, "platinum"], [0xF4A6B8, "pink"], [RED, "red"],
    [0xA8261A, "deep red"], [ORANGE, "orange"], [GOLD, "gold"], [0xF2E36B, "yellow"], [0x8A5A33, "brown"],
    [BLACK, "black"], [0x4F6F96, "slate blue"], [0x6FA8C9, "sky blue"], [0x6E9E5A, "moss green"],
  ];
  const CUSTOM_DEFAULT = [0, 4, 4, 0, 10, 4, 0, 0];
  const PART_NAMES = ["head", "body 1", "body 2", "body 3", "body 4", "body 5", "body 6", "tail"];
  const PAD = 0x4E8C35, PAD_DARK = 0x346A27, PAD_LIGHT = 0x6FAA4B;
  const PELLET = 0xC98B47, PELLET_LIGHT = 0xEBC07E;
  const SEGS = 8, SEG_LEN = 1.6;
  const PROFILE = [1.9, 2.4, 2.6, 2.4, 2.1, 1.7, 1.2, 0.8];
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const PAD_MODES = ["none", "a few", "lots"];

  // ---------------- settings (remembered in this browser only) ----------------
  const WEATHERS = [["clear", "clear"], ["rain", "rain"], ["blossoms", "blossoms"], ["leaves", "leaves"], ["snow", "snow"], ["season", "by season"]];
  const DEFAULTS = { count: 7, colors: "mixed", speed: 5, water: 0, pads: 1, custom: CUSTOM_DEFAULT.slice(), weather: "season", visitors: 1, sound: 0, volume: 6 };
  let prefs = { ...DEFAULTS, custom: CUSTOM_DEFAULT.slice() };
  try {
    const saved = JSON.parse(localStorage.getItem("koi-pond-settings") || "null");
    if (saved && typeof saved === "object") prefs = { ...prefs, ...saved };
  } catch (e) { /* storage unavailable: use defaults */ }
  if (!Array.isArray(prefs.custom) || prefs.custom.length !== 8) prefs.custom = CUSTOM_DEFAULT.slice();
  prefs.custom = prefs.custom.map((v) => clampIdx(v));
  function clampIdx(v) { v = Math.round(+v) || 0; return v < 0 ? 0 : v >= PALETTE.length ? PALETTE.length - 1 : v; }
  const customPattern = () => prefs.custom.map((i) => PALETTE[i][0]);
  function savePrefs() {
    try { localStorage.setItem("koi-pond-settings", JSON.stringify(prefs)); } catch (e) {}
  }

  // ---------------- helpers ----------------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const wrap = (a) => {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  };
  const dither = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
  function mix(c1, c2, a) {
    const ia = 255 - a;
    const r = ((((c1 >> 16) & 255) * ia + ((c2 >> 16) & 255) * a) / 255) | 0;
    const g = ((((c1 >> 8) & 255) * ia + ((c2 >> 8) & 255) * a) / 255) | 0;
    const b = (((c1 & 255) * ia + (c2 & 255) * a) / 255) | 0;
    return (r << 16) | (g << 8) | b;
  }

  // ---------------- canvas & pixel buffer ----------------
  const canvas = document.getElementById("pond");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, scale = 3, px, img, out32;

  function set(x, y, c) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    px[y * W + x] = c;
  }
  function blend(x, y, c, a) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= W || y >= H || a <= 0) return;
    const i = y * W + x;
    px[i] = a >= 255 ? c : mix(px[i], c, a | 0);
  }
  function fillCircle(cx, cy, r, c, a) {
    if (r <= 0) return;
    const x0 = Math.floor(cx - r), x1 = Math.ceil(cx + r);
    const y0 = Math.floor(cy - r), y1 = Math.ceil(cy + r);
    const r2 = r * r;
    for (let y = y0; y <= y1; y++) {
      const dy = y + 0.5 - cy;
      for (let x = x0; x <= x1; x++) {
        const dx = x + 0.5 - cx;
        if (dx * dx + dy * dy <= r2) blend(x, y, c, a);
      }
    }
  }
  function line(x0, y0, x1, y1, c, a) {
    const dx = x1 - x0, dy = y1 - y0;
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
    let lx = NaN, ly = NaN;
    for (let i = 0; i <= steps; i++) {
      const x = Math.floor(x0 + (dx * i) / steps), y = Math.floor(y0 + (dy * i) / steps);
      if (x === lx && y === ly) continue;
      blend(x, y, c, a);
      lx = x; ly = y;
    }
  }
  function ring(cx, cy, r, c, a) {
    const steps = Math.max(12, (r * 7) | 0);
    let lx = NaN, ly = NaN;
    for (let i = 0; i < steps; i++) {
      const ang = (i * Math.PI * 2) / steps;
      const x = Math.floor(cx + Math.cos(ang) * r);
      const y = Math.floor(cy + Math.sin(ang) * r * 0.8); // slightly flattened, seen at an angle
      if (x === lx && y === ly) continue;
      blend(x, y, c, a);
      lx = x; ly = y;
    }
  }

  // ---------------- pond state ----------------
  let koi = [], pellets = [], ripples = [], pads = [];
  let floor, stars = [], flies = [];
  let t = 0, ambient = 3, food = false;
  let lastRippleX = 0, lastRippleY = 0;

  function patternFor(i) {
    if (prefs.colors === "custom") return customPattern();
    if (prefs.colors === "mix") return i % 3 === 0 ? customPattern() : PATTERNS[i % PATTERNS.length];
    if (prefs.colors === "mixed") return PATTERNS[i % PATTERNS.length];
    return PATTERNS[+prefs.colors] || PATTERNS[0];
  }

  function newKoi(i) {
    const k = {
      x: new Float32Array(SEGS), y: new Float32Array(SEGS),
      ang: rand(-3.14, 3.14), size: rand(0.85, 1.35), base: rand(5, 8),
      phase: rand(0, 6), fear: 0, fleeAng: 0, wanderTimer: 0, colors: patternFor(i), curious: rand(0.3, 1), bored: 0, look: 0,
    };
    k.speed = k.base;
    k.wanderHeading = k.ang;
    const hx = rand(15, Math.max(16, W - 15)), hy = rand(15, Math.max(16, H - 15));
    for (let j = 0; j < SEGS; j++) {
      k.x[j] = hx - Math.cos(k.ang) * j * SEG_LEN;
      k.y[j] = hy - Math.sin(k.ang) * j * SEG_LEN;
    }
    return k;
  }

  function syncKoi() {
    while (koi.length > prefs.count) koi.pop();
    while (koi.length < prefs.count) koi.push(newKoi(koi.length));
    koi.forEach((k, i) => { k.colors = patternFor(i); });
  }

  function buildPads() {
    pads = [];
    const n = prefs.pads === 0 ? 0 : prefs.pads === 1 ? 4 : 7;
    const spots = [[0.16, 0.12], [0.84, 0.3], [0.22, 0.78], [0.8, 0.9], [0.5, 0.06], [0.1, 0.48], [0.88, 0.62]];
    for (let i = 0; i < n; i++) {
      pads.push({
        x: spots[i][0] * W + rand(-4, 4), y: spots[i][1] * H + rand(-4, 4),
        r: rand(6, 9), notch: rand(0, 6.28), flower: i === 1 || i === 5,
      });
    }
  }

  function buildPond() {
    // Pond floor: deeper (darker) in the middle, with pale stones on the bottom.
    floor = new Float32Array(W * H);
    const cx = W / 2, cy = H / 2;
    const nStones = Math.round(9 * Math.max(1, (W * H) / (120 * 160)));
    const stones = [];
    for (let i = 0; i < nStones; i++) stones.push([rand(0, W), rand(0, H), rand(3, 8)]);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const dx = (x - cx) / cx, dy = (y - cy) / cy;
        const d = Math.sqrt(dx * dx + dy * dy) / 1.414;
        let v = -0.55 * (1 - d) + 0.1;
        for (const st of stones) {
          const sx = (x - st[0]) / st[2], sy = (y - st[1]) / (st[2] * 0.75);
          const sd = sx * sx + sy * sy;
          if (sd < 1) v += 0.35 * (1 - sd);
        }
        floor[y * W + x] = v;
      }
    }
    stars = [];
    const nStars = Math.round((W * H) / 320);
    for (let i = 0; i < nStars; i++)
      stars.push([rand(0, W), rand(0, H), rand(0, 6.28), rand(0.6, 2.2), Math.random() < 0.125]);
    flies = [];
    for (let i = 0; i < 6; i++) flies.push([rand(0, W), rand(0, H), rand(0, 6.28), rand(0.3, 0.8)]);
    buildPads();
    pellets = [];
    ripples = [];
    resetVisitors();
  }

  function layout() {
    const w = window.innerWidth, h = window.innerHeight;
    const s = Math.max(2, Math.round(Math.min(w, h) / 150));
    const gw = Math.ceil(w / s), gh = Math.ceil(h / s);
    if (gw === W && gh === H && s === scale) return;
    scale = s; W = gw; H = gh;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W * scale + "px";
    canvas.style.height = H * scale + "px";
    img = ctx.createImageData(W, H);
    out32 = new Uint32Array(img.data.buffer);
    px = new Int32Array(W * H);
    buildPond();
    // keep existing fish, just tuck them inside the new edges
    for (const k of koi)
      for (let j = 0; j < SEGS; j++) {
        k.x[j] = clamp(k.x[j], 3, W - 3);
        k.y[j] = clamp(k.y[j], 3, H - 3);
      }
    syncKoi();
  }

  // ---------------- simulation ----------------
  function addRipple(x, y, r, max, alpha) {
    if (ripples.length > 40) return;
    ripples.push({ x, y, r, life: 0, max, alpha });
  }

  function startle(x, y, radius) {
    for (const k of koi) {
      const d = Math.hypot(k.x[0] - x, k.y[0] - y);
      if (d < radius) {
        k.fear = Math.min(1, Math.max(k.fear, 1.15 - d / radius));
        k.fleeAng = Math.atan2(k.y[0] - y, k.x[0] - x) + rand(-0.3, 0.3);
        k.wanderHeading = k.fleeAng;
      }
    }
  }

  function dropFood(x, y) {
    addRipple(x, y, 1, 1.2, 120);
    for (let i = 0; i < 5 && pellets.length < 40; i++)
      pellets.push({ x: clamp(x + rand(-4, 4), 1, W - 2), y: clamp(y + rand(-4, 4), 1, H - 2), age: 0 });
  }

  // ---------------- sound (all made in the browser, no audio files) ----------------
  const audio = { ctx: null, master: null, ambGain: null, rainGain: null, white: null };
  const soundOn = () => !!(prefs.sound && audio.ctx && audio.ctx.state === "running");
  function audioInit() {
    if (audio.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const c = new AC();
    audio.ctx = c;
    audio.master = c.createGain();
    audio.master.gain.value = 0;
    audio.master.connect(c.destination);
    const len = c.sampleRate * 3;
    const brownBuf = c.createBuffer(1, len, c.sampleRate), whiteBuf = c.createBuffer(1, len, c.sampleRate);
    const bd = brownBuf.getChannelData(0), wd = whiteBuf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      wd[i] = w;
      last = (last + 0.02 * w) / 1.02;
      bd[i] = last * 3.5;
    }
    audio.white = whiteBuf;
    const loop = (buf) => { const s = c.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
    // the pond's hush: low, slowly breathing water noise
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420;
    audio.ambGain = c.createGain(); audio.ambGain.gain.value = 0.32;
    const lfo = c.createOscillator(), lfoGain = c.createGain();
    lfo.frequency.value = 0.07; lfoGain.gain.value = 0.12;
    lfo.connect(lfoGain).connect(audio.ambGain.gain); lfo.start();
    loop(brownBuf).connect(lp).connect(audio.ambGain).connect(audio.master);
    // rain hiss, faded in only when it rains
    const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1400;
    const lp2 = c.createBiquadFilter(); lp2.type = "lowpass"; lp2.frequency.value = 6500;
    audio.rainGain = c.createGain(); audio.rainGain.gain.value = 0;
    loop(whiteBuf).connect(hp).connect(lp2).connect(audio.rainGain).connect(audio.master);
    return true;
  }
  function applyVolume() {
    if (!audio.ctx) return;
    const v = prefs.sound ? Math.pow(prefs.volume / 10, 2) * 0.9 : 0;
    audio.master.gain.setTargetAtTime(v, audio.ctx.currentTime, 0.25);
  }
  function setSound(on) {
    prefs.sound = on ? 1 : 0;
    savePrefs();
    if (on && audioInit()) audio.ctx.resume().then(applyVolume).catch(() => {});
    applyVolume();
    soundBtn.setAttribute("aria-pressed", String(!!on));
    soundBtn.setAttribute("aria-label", on ? "Sound off" : "Sound on");
  }
  function tone(f0, f1, dur, gain, type = "sine", when = 0) {
    if (!soundOn()) return;
    const c = audio.ctx, t0 = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.08);
    o.connect(g).connect(audio.master);
    o.start(t0);
    o.stop(t0 + dur + 0.1);
  }
  function noiseBurst(freq, q, dur, gain, when = 0) {
    if (!soundOn()) return;
    const c = audio.ctx, t0 = c.currentTime + when;
    const s = c.createBufferSource(); s.buffer = audio.white;
    const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(bp).connect(g).connect(audio.master);
    s.start(t0, Math.random() * 2);
    s.stop(t0 + dur + 0.05);
  }
  const sfx = {
    plip: () => { tone(rand(820, 1000), 380, 0.09, 0.22); tone(rand(1100, 1300), 700, 0.05, 0.06, "sine", 0.07); },
    drip: (g = 0.07) => tone(rand(600, 950), 320, 0.08, g),
    nibble: () => tone(rand(480, 560), 240, 0.06, 0.07),
    gulp: () => tone(rand(240, 290), 130, 0.12, 0.12),
    splash: (g = 0.24) => { noiseBurst(900, 0.7, 0.28, g); tone(320, 110, 0.16, g * 0.6); },
    croak: (g = 0.2) => {
      if (!soundOn()) return;
      const c = audio.ctx;
      for (const off of [0, 0.19]) {
        const t0 = c.currentTime + off;
        const o = c.createOscillator(), lp = c.createBiquadFilter(), gg = c.createGain();
        o.type = "sawtooth";
        o.frequency.setValueAtTime(118, t0);
        o.frequency.exponentialRampToValueAtTime(82, t0 + 0.13);
        lp.type = "lowpass"; lp.frequency.value = 650; lp.Q.value = 4;
        gg.gain.setValueAtTime(0.0001, t0);
        gg.gain.exponentialRampToValueAtTime(g, t0 + 0.02);
        gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
        o.connect(lp).connect(gg).connect(audio.master);
        o.start(t0); o.stop(t0 + 0.16);
      }
    },
    cricket: () => { for (let i = 0; i < 3; i++) tone(4300, 4200, 0.025, 0.018, "sine", i * 0.045); },
    tick: () => tone(rand(1300, 1600), 900, 0.03, 0.025),
  };
  let cricketTimer = 3, farFrogTimer = 20, rainDripTimer = 0;
  function updateSound(dt) {
    if (!soundOn()) return;
    const c = audio.ctx, w = currentWeather();
    audio.rainGain.gain.setTargetAtTime(w === "rain" ? 0.22 : 0, c.currentTime, 0.8);
    audio.ambGain.gain.setTargetAtTime(w === "snow" ? 0.2 : 0.32, c.currentTime, 0.8);
    if (w === "rain" && (rainDripTimer -= dt) <= 0) { rainDripTimer = rand(0.05, 0.25); sfx.drip(0.03); }
    if (prefs.water === NIGHT) {
      if ((cricketTimer -= dt) <= 0) { cricketTimer = rand(0.8, 3.5); sfx.cricket(); }
      if ((farFrogTimer -= dt) <= 0) { farFrogTimer = rand(18, 45); sfx.croak(0.05); }
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (!audio.ctx) return;
    if (document.hidden) audio.ctx.suspend().catch(() => {});
    else if (prefs.sound) audio.ctx.resume().catch(() => {});
  });

  // ---------------- curious koi (desktop mouse) ----------------
  // Rest the cursor over the water and nearby koi come to look; whip it across and they scatter.
  const cursor = { on: false, x: 0, y: 0, still: 0, speed: 0, lastT: 0, scareCool: 0, onPad: false };
  function updateCursor(dt) {
    if (!cursor.on) return;
    cursor.speed *= Math.max(0, 1 - dt * 8);
    cursor.still = cursor.speed < 6 ? cursor.still + dt : 0;
    // a cursor resting on a lily pad isn't over open water, so the koi ignore it
    cursor.onPad = pads.some((p) => {
      const dx = cursor.x - p.x, dy = (cursor.y - p.y) / 0.85;
      return dx * dx + dy * dy <= (p.r + 1.5) * (p.r + 1.5);
    });
    if (cursor.scareCool > 0) cursor.scareCool -= dt;
  }
  function onCursorMove(x, y) {
    const now = performance.now();
    if (cursor.on && cursor.lastT) {
      const dt = Math.max(0.008, (now - cursor.lastT) / 1000);
      const v = Math.hypot(x - cursor.x, y - cursor.y) / dt;
      cursor.speed = cursor.speed * 0.5 + v * 0.5;
      if (cursor.speed > 160 && cursor.scareCool <= 0) {
        // scare along the whole path the cursor swept, not just where it ended up
        const len = Math.hypot(x - cursor.x, y - cursor.y), n = Math.max(1, Math.ceil(len / 8));
        for (let i = 0; i <= n; i++) startle(cursor.x + ((x - cursor.x) * i) / n, cursor.y + ((y - cursor.y) * i) / n, 22);
        cursor.scareCool = 0.15;
      }
    }
    cursor.on = true;
    cursor.x = x; cursor.y = y; cursor.lastT = now;
  }

  // ---------------- weather ----------------
  // Things fall toward the water (h = height above it), then float on the surface for a while.
  let drift = [], spawnAcc = 0;
  const PETAL = [0xF4B6C8, 0xF9D3DE, 0xE995AE];
  const LEAF = [0xD9822B, 0xC4472D, 0xE6B13A, 0x9C5A2B];
  const SEASON_OF_MONTH = ["snow", "snow", "blossoms", "blossoms", "blossoms", "clear", "clear", "clear", "leaves", "leaves", "leaves", "snow"];
  function currentWeather() {
    return prefs.weather === "season" ? SEASON_OF_MONTH[new Date().getMonth()] : prefs.weather;
  }
  const areaK = () => Math.max(1, (W * H) / (120 * 160));
  const windX = () => 2.5 + Math.sin(t * 0.05) * 3;

  function spawnDrift(kind) {
    const d = { kind, x: rand(-12, W + 4), y: rand(-4, H), age: 0, life: rand(35, 60), flip: Math.random() < 0.5 };
    if (kind === "snow") { d.h = rand(18, 34); d.vh = rand(9, 14); d.col = 0xF4F8FF; d.big = Math.random() < 0.3; d.life = rand(2, 3.5); }
    else if (kind === "leaves") { d.h = rand(22, 40); d.vh = rand(5, 8); d.col = LEAF[(Math.random() * LEAF.length) | 0]; }
    else { d.h = rand(20, 36); d.vh = rand(6, 9); d.col = PETAL[(Math.random() * PETAL.length) | 0]; }
    drift.push(d);
  }

  function updateWeather(dt) {
    const w = currentWeather();
    const rate = { rain: 9, blossoms: 0.7, leaves: 0.4, snow: 3.5 }[w] || 0;
    spawnAcc += rate * areaK() * dt;
    while (spawnAcc >= 1) {
      spawnAcc -= 1;
      if (w === "rain") {
        const x = rand(0, W), y = rand(0, H);
        addRipple(x, y, 0.4, 0.7, 95);
        splashes.push({ x, y, life: 0.12 });
      } else if (drift.length < 140) spawnDrift(w);
    }
    for (let i = splashes.length - 1; i >= 0; i--) if ((splashes[i].life -= dt) <= 0) splashes.splice(i, 1);
    const wx = windX();
    for (let i = drift.length - 1; i >= 0; i--) {
      const d = drift[i];
      if (d.h > 0) {
        // falling: flutter sideways with the breeze
        d.h -= d.vh * dt;
        d.x += (wx + Math.sin(t * 3 + d.y) * (d.kind === "snow" ? 1.5 : 4)) * dt;
        if (Math.random() < dt * 3) d.flip = !d.flip;
        if (d.h <= 0) {
          d.h = 0;
          if (d.kind !== "snow") {
            addRipple(d.x, d.y, 0.5, 0.8, 70);
            if (Math.random() < 0.15) sfx.tick();
          }
        }
        continue;
      }
      // floating: carried by a slow current, nudged aside by passing koi
      d.age += dt;
      d.x += (Math.sin(t * 0.2 + d.y * 0.05) * 0.6 + wx * 0.08) * dt;
      d.y += Math.cos(t * 0.17 + d.x * 0.04) * 0.4 * dt;
      for (const k of koi) {
        const dx = d.x - k.x[0], dy = d.y - k.y[0], dd = Math.hypot(dx, dy);
        if (dd < 4 && dd > 0.01) { d.x += (dx / dd) * 7 * dt; d.y += (dy / dd) * 7 * dt; }
      }
      if (d.age > d.life || d.x > W + 6 || d.x < -6 || d.y < -6 || d.y > H + 6) drift.splice(i, 1);
    }
  }

  function drawDriftItem(d, x, y, a, night) {
    const c = night ? mix(d.col, 0x0C1630, d.kind === "snow" ? 60 : 110) : d.col;
    if (d.kind === "snow") {
      blend(x, y, c, a);
      if (d.big) { blend(x + 1, y, c, a * 0.6); blend(x, y + 1, c, a * 0.6); }
    } else if (d.kind === "leaves") {
      const dark = mix(c, 0x000000, 70);
      if (d.flip) { blend(x, y, c, a); blend(x + 1, y, c, a); blend(x + 2, y, dark, a); blend(x, y + 1, c, a); blend(x + 1, y + 1, c, a); }
      else { blend(x, y, c, a); blend(x, y + 1, c, a); blend(x, y + 2, dark, a); blend(x + 1, y, c, a); blend(x + 1, y + 1, c, a); }
    } else {
      blend(x, y, c, a);
      blend(x + (d.flip ? 1 : 0), y + (d.flip ? 0 : 1), c, a);
      blend(x + 1, y + 1, mix(c, 0xFFFFFF, 90), a * 0.8);
    }
  }

  function drawFloating(night) {
    for (const d of drift) {
      if (d.h > 0) continue;
      const fade = d.kind === "snow" ? 1 - d.age / d.life : Math.min(1, (d.life - d.age) / 3);
      if (fade <= 0) continue;
      drawDriftItem(d, Math.floor(d.x), Math.floor(d.y), 230 * fade, night);
    }
  }

  function drawFalling(night) {
    for (const d of drift) {
      if (d.h <= 0) continue;
      // shadow on the water, offset by height
      blend(d.x + 2 + d.h * 0.12, d.y + 3 + d.h * 0.16, 0x000000, 45);
      drawDriftItem(d, Math.floor(d.x), Math.floor(d.y), 255, night);
    }
  }

  // ---------------- visitors: frog, dragonfly, koi gulps ----------------
  let splashes = [];
  const frog = { state: 0, timer: rand(8, 15), pad: null, x: 0, y: 0, sx: 0, sy: 0, ex: 0, ey: 0, f: 0, blink: 0, croak: 0, up: true };
  const fly = { state: 0, timer: rand(5, 12), x: 0, y: 0, tx: 0, ty: 0, ang: 0, hover: 0, legs: 0 };
  let gulpTimer = rand(8, 18), gulps = [];

  function resetVisitors() {
    frog.state = 0; frog.timer = rand(8, 15);
    fly.state = 0; fly.timer = rand(5, 12);
    drift = []; splashes = []; gulps = [];
  }

  function frogHopOff() {
    frog.state = 4; frog.f = 0;
    frog.sx = frog.x; frog.sy = frog.y;
    const a = rand(0, Math.PI * 2), r = frog.pad.r + rand(6, 10);
    frog.ex = clamp(frog.pad.x + Math.cos(a) * r, 3, W - 3);
    frog.ey = clamp(frog.pad.y + Math.sin(a) * r, 3, H - 3);
  }

  function updateFrog(dt) {
    if (!prefs.visitors || !pads.length) { frog.state = 0; return; }
    switch (frog.state) {
      case 0: // away
        if ((frog.timer -= dt) <= 0) {
          frog.pad = pads[(Math.random() * pads.length) | 0];
          const a = rand(0, Math.PI * 2), r = frog.pad.r + 6;
          frog.x = clamp(frog.pad.x + Math.cos(a) * r, 3, W - 3);
          frog.y = clamp(frog.pad.y + Math.sin(a) * r, 3, H - 3);
          frog.up = Math.random() < 0.5;
          frog.state = 1; frog.timer = 2.2;
          addRipple(frog.x, frog.y, 1, 1.2, 110);
          sfx.drip(0.1);
        }
        break;
      case 1: // just its eyes above the water
        if ((frog.timer -= dt) <= 0) {
          frog.state = 2; frog.f = 0;
          frog.sx = frog.x; frog.sy = frog.y;
          frog.ex = frog.pad.x + rand(-1.5, 1.5); frog.ey = frog.pad.y + rand(-1, 1);
          addRipple(frog.x, frog.y, 1, 1, 120);
        }
        break;
      case 2: // hop up onto the pad
      case 4: // hop off into the water
        frog.f += dt / 0.45;
        frog.x = frog.sx + (frog.ex - frog.sx) * Math.min(1, frog.f);
        frog.y = frog.sy + (frog.ey - frog.sy) * Math.min(1, frog.f);
        if (frog.f >= 1) {
          if (frog.state === 2) { frog.state = 3; frog.timer = rand(14, 28); }
          else {
            addRipple(frog.x, frog.y, 1, 1.6, 170);
            addRipple(frog.x, frog.y, -2, 1.8, 100);
            sfx.splash(0.16);
            frog.state = 0; frog.timer = rand(45, 90);
          }
        }
        break;
      case 3: // sitting
        frog.blink = frog.blink > 0 ? frog.blink - dt : (Math.random() < dt * 0.4 ? 0.18 : 0);
        if (frog.croak > 0) frog.croak -= dt;
        else if (Math.random() < dt * 0.06) { frog.croak = 0.9; sfx.croak(); }
        if ((frog.timer -= dt) <= 0) frogHopOff();
        break;
    }
  }

  function drawFrog(night) {
    if (frog.state === 0) return;
    const G = night ? 0x4F7A34 : 0x9ACD5A, D = night ? 0x2F4F22 : 0x557F2E, L = night ? 0x41662C : 0x79A844;
    const EYE = 0x15140F, RIM = night ? 0x7F9A5A : 0xB9D27A;
    if (frog.state === 1) {
      const x = Math.floor(frog.x), y = Math.floor(frog.y);
      blend(x - 1, y, RIM, 230); blend(x + 1, y, RIM, 230);
      blend(x - 1, y, EYE, 160); blend(x + 1, y, EYE, 160);
      return;
    }
    let lift = 0;
    if (frog.state === 2 || frog.state === 4) lift = Math.sin(Math.min(1, frog.f) * Math.PI) * 5;
    const cx = Math.floor(frog.x), cy = Math.floor(frog.y);
    // shadow
    fillCircle(cx + 1.5 + lift * 0.3, cy + 2 + lift * 0.5, 2.6, 0x000000, 60);
    const rows = ["..e.e..", ".GGGGG.", "lGGdGGl", ".GdGGG.", ".GGGdG.", "LL...LL"];
    const oy = cy - 3 - Math.round(lift);
    for (let r = 0; r < rows.length; r++) {
      const row = rows[frog.up ? r : rows.length - 1 - r];
      for (let c = 0; c < 7; c++) {
        const ch = row[c];
        if (ch === ".") continue;
        let col = ch === "G" ? G : ch === "d" ? D : L;
        if (ch === "e") col = frog.blink > 0 ? G : EYE;
        blend(cx - 3 + c, oy + r, col, 255);
      }
    }
    if (frog.state === 3 && frog.croak > 0) {
      // throat balloon puffs out at the front
      const s = Math.sin((1 - frog.croak / 0.9) * Math.PI);
      const fy = frog.up ? oy - 1 : oy + rows.length;
      fillCircle(cx + 0.5, fy + 0.5, 1 + s * 1.4, night ? 0xA8A880 : 0xEDE7B8, 230);
    }
  }

  function updateFly(dt) {
    if (!prefs.visitors || currentWeather() === "snow") { if (fly.state) fly.state = 0; return; }
    if (fly.state === 0) {
      if ((fly.timer -= dt) <= 0) {
        const fromLeft = Math.random() < 0.5;
        fly.x = fromLeft ? -6 : W + 6; fly.y = rand(H * 0.15, H * 0.85);
        fly.legs = 4 + ((Math.random() * 4) | 0);
        fly.state = 1; fly.hover = 0;
        fly.tx = rand(W * 0.15, W * 0.85); fly.ty = rand(H * 0.15, H * 0.85);
      }
      return;
    }
    if (fly.hover > 0) {
      fly.hover -= dt;
      fly.x += Math.sin(t * 13) * 0.08; fly.y += Math.cos(t * 11) * 0.08;
      return;
    }
    const dx = fly.tx - fly.x, dy = fly.ty - fly.y, d = Math.hypot(dx, dy);
    const sp = 45 * dt;
    fly.ang = Math.atan2(dy, dx);
    if (d <= sp) {
      fly.x = fly.tx; fly.y = fly.ty;
      fly.legs--;
      if (fly.state === 2 || fly.legs <= 0) {
        if (fly.state === 2) { fly.state = 0; fly.timer = rand(30, 70); return; }
        fly.state = 2; // leave
        fly.tx = Math.random() < 0.5 ? -10 : W + 10; fly.ty = rand(0, H);
        return;
      }
      fly.hover = rand(0.5, 2.2);
      if (Math.random() < 0.35) { addRipple(fly.x, fly.y + 1, 0.4, 0.9, 120); sfx.tick(); } // touches the water
      fly.tx = clamp(fly.x + rand(-W * 0.4, W * 0.4), 6, W - 6);
      fly.ty = clamp(fly.y + rand(-H * 0.4, H * 0.4), 6, H - 6);
    } else {
      fly.x += (dx / d) * sp; fly.y += (dy / d) * sp;
    }
  }

  function drawFly(night) {
    if (fly.state === 0) return;
    const ca = Math.cos(fly.ang), sa = Math.sin(fly.ang);
    const body = night ? 0x2A5F70 : 0x2E9FB8, head = night ? 0x3D7F8A : 0x5FD0C8;
    // shadow on the water
    for (let i = -2; i <= 2; i++) blend(fly.x + 4 + ca * i, fly.y + 6 + sa * i, 0x000000, 35);
    // wings: two pairs across the body, shimmering
    const wa = 90 + 60 * Math.abs(Math.sin(t * 40));
    for (const off of [0.6, -0.6]) {
      const wx = fly.x + ca * off, wy = fly.y + sa * off;
      for (let i = 1; i <= 3; i++) {
        blend(wx - sa * i, wy + ca * i, 0xDDF2F5, wa);
        blend(wx + sa * i, wy - ca * i, 0xDDF2F5, wa);
      }
    }
    for (let i = -3; i <= 1; i++) blend(fly.x + ca * i, fly.y + sa * i, body, 255);
    blend(fly.x + ca * 2, fly.y + sa * 2, head, 255);
  }

  function updateGulps(dt) {
    if (!prefs.visitors) return;
    if ((gulpTimer -= dt) <= 0 && koi.length) {
      gulpTimer = rand(8, 20);
      const k = koi[(Math.random() * koi.length) | 0];
      if (k.fear <= 0) gulps.push({ k, n: 0, timer: 0 });
    }
    for (let i = gulps.length - 1; i >= 0; i--) {
      const g = gulps[i];
      if ((g.timer -= dt) > 0) continue;
      addRipple(g.k.x[0] + Math.cos(g.k.ang) * 1.5, g.k.y[0] + Math.sin(g.k.ang) * 1.5, 0.5, 1.0, 150);
      sfx.gulp();
      g.timer = 0.35;
      if (++g.n >= 2) gulps.splice(i, 1);
    }
  }

  /** Tap on a visitor? Returns true if it was handled. */
  function tapVisitor(x, y) {
    if (fly.state && Math.hypot(x - fly.x, y - fly.y) < 6) {
      fly.state = 2; fly.hover = 0;
      fly.tx = fly.x < W / 2 ? -10 : W + 10; fly.ty = clamp(fly.y + rand(-20, 20), 0, H);
      return true;
    }
    if (frog.state === 3 && Math.hypot(x - frog.x, y - frog.y) < 6) {
      frog.croak = 0.9;
      frog.timer = 1.1; // croaks, then hops off
      sfx.croak();
      return true;
    }
    return false;
  }

  function updateKoi(k, dt, speedMul) {
    const hx = k.x[0], hy = k.y[0];
    const base = k.base * speedMul;

    // Gentle wandering toward a heading that changes now and then
    k.wanderTimer -= dt;
    if (k.wanderTimer <= 0) {
      k.wanderTimer = rand(3, 7);
      k.wanderHeading = k.ang + rand(-0.9, 0.9);
    }
    let desired = k.wanderHeading, target = base, turnRate = 0.55;

    // Food
    let best = null, bestD = Math.max(75, Math.min(W, H) * 0.6);
    for (const p of pellets) {
      const d = Math.hypot(hx - p.x, hy - p.y);
      if (d < bestD) { bestD = d; best = p; }
    }
    if (best) {
      desired = Math.atan2(best.y - hy, best.x - hx);
      const off = Math.abs(wrap(desired - k.ang));
      target = base * (bestD < 12 ? 1.2 : 2.0) * (off > 1.2 ? 0.55 : 1);
      turnRate = 1.6;
      if (bestD < 2.6 * k.size) {
        pellets.splice(pellets.indexOf(best), 1);
        addRipple(best.x, best.y, 1, 0.9, 140);
        sfx.nibble();
      }
    } else if (k.bored > 0) {
      k.bored -= dt;
    } else if (cursor.on && cursor.still > 0.6 && !dragging && !cursor.onPad) {
      // curious: swim over to look at a resting cursor, slowing as they arrive,
      // then lose interest after a while and wander off
      const d = Math.hypot(cursor.x - hx, cursor.y - hy), reach = 20 + Math.min(W, H) * (0.2 + 0.45 * k.curious);
      if (d < 12 && (k.look = (k.look || 0) + dt) > 5 + 8 * k.curious) {
        k.look = 0;
        k.bored = rand(8, 20);
        k.wanderHeading = k.ang + rand(-1.5, 1.5);
      } else if (d < reach) {
        desired = Math.atan2(cursor.y - hy, cursor.x - hx);
        target = base * (d < 7 ? 0.25 : d < 15 ? 0.6 : 1.1);
        turnRate = 1.1;
        k.wanderTimer = Math.max(k.wanderTimer, 1);
      }
    }

    // Fear overrides everything
    if (k.fear > 0) {
      desired = k.fleeAng;
      target = base * (1 + 4 * k.fear);
      turnRate = 4.5;
      k.fear -= dt * 0.6;
    }

    // Keep clear of the edges and of each other
    let dx = Math.cos(desired), dy = Math.sin(desired);
    const m = 18;
    if (hx < m) dx += ((m - hx) / m) * 2;
    if (hx > W - m) dx -= ((hx - (W - m)) / m) * 2;
    if (hy < m) dy += ((m - hy) / m) * 2;
    if (hy > H - m) dy -= ((hy - (H - m)) / m) * 2;
    for (const o of koi) {
      if (o === k) continue;
      const d = Math.hypot(hx - o.x[2], hy - o.y[2]);
      if (d < 7 && d > 0.01) {
        dx += ((hx - o.x[2]) / d) * ((7 - d) / 7) * 0.8;
        dy += ((hy - o.y[2]) / d) * ((7 - d) / 7) * 0.8;
      }
    }
    desired = Math.atan2(dy, dx);
    if (hx < m || hx > W - m || hy < m || hy > H - m) {
      turnRate = Math.max(turnRate, 1.4);
      k.wanderHeading = desired;
    }

    // Fish can't pivot on the spot: cap turning so the turn radius stays wide
    const maxRate = Math.max(0.35, k.speed / (7 * k.size));
    const maxTurn = Math.min(turnRate, maxRate) * dt;
    k.ang = wrap(k.ang + clamp(wrap(desired - k.ang), -maxTurn, maxTurn));
    k.speed += (target - k.speed) * Math.min(1, dt * 2);

    k.phase += dt * (2.5 + k.speed * 0.45);
    const heading = k.ang + Math.sin(k.phase) * 0.18;
    k.x[0] = clamp(hx + Math.cos(heading) * k.speed * dt, 2, W - 2);
    k.y[0] = clamp(hy + Math.sin(heading) * k.speed * dt, 2, H - 2);

    // Body follows the head like a chain
    const seg = SEG_LEN * k.size;
    for (let j = 1; j < SEGS; j++) {
      const ex = k.x[j - 1] - k.x[j], ey = k.y[j - 1] - k.y[j];
      const d = Math.sqrt(ex * ex + ey * ey);
      if (d > seg) {
        k.x[j] += (ex * (d - seg)) / d;
        k.y[j] += (ey * (d - seg)) / d;
      }
    }
  }

  function update(dt) {
    t += dt;
    ambient -= dt;
    if (ambient <= 0) {
      ambient = rand(3, 7) * Math.min(1, (120 * 160) / (W * H)) + 1;
      addRipple(rand(5, W - 5), rand(5, H - 5), 6, 1.6, 70);
      sfx.drip();
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life += dt;
      r.r += dt * 9;
      if (r.life >= r.max) ripples.splice(i, 1);
    }
    for (let i = pellets.length - 1; i >= 0; i--) {
      const p = pellets[i];
      p.age += dt;
      p.x += Math.sin(t * 0.7 + i) * dt * 0.4;
      if (p.age > 45) pellets.splice(i, 1);
    }
    if (prefs.water === NIGHT) {
      for (const f of flies) {
        f[2] += dt * f[3];
        f[0] += Math.cos(f[2]) * dt * 3;
        f[1] += Math.sin(f[2] * 1.3) * dt * 2.5;
        if (f[0] < 0) f[0] += W;
        if (f[0] >= W) f[0] -= W;
        if (f[1] < 0) f[1] += H;
        if (f[1] >= H) f[1] -= H;
      }
    }
    const speedMul = 0.35 + prefs.speed * 0.13; // 5 = normal pace
    for (const k of koi) updateKoi(k, dt, speedMul);
    updateCursor(dt);
    updateSound(dt);
    updateWeather(dt);
    updateFrog(dt);
    updateFly(dt);
    updateGulps(dt);
  }

  // ---------------- drawing ----------------
  function drawWater() {
    const pal = WATERS[prefs.water].c, last = pal.length - 1;
    const amp = prefs.water === NIGHT ? 0.6 : 1;
    for (let y = 0; y < H; y++) {
      const sy1 = y * 0.23 - t * 0.45;
      for (let x = 0; x < W; x++) {
        const v = floor[y * W + x] + amp * (
          0.11 * (Math.sin(x * 0.31 + t * 0.6) + Math.sin(sy1) + Math.sin((x - y) * 0.17 + t * 0.3)) +
          0.07 * Math.sin(x * 0.55 + Math.sin(y * 0.4 + t * 0.8) * 1.6 + t));
        let i = ((v + 0.75) * 3.2 + dither(x, y) - 0.5) | 0;
        if (i < 0) i = 0;
        if (i > last) i = last;
        px[y * W + x] = pal[i];
      }
    }
  }

  function drawNightSky() {
    // the sky reflected in the water: twinkling stars and a broken moon
    for (const st of stars) {
      const tw = 0.5 + 0.5 * Math.sin(t * st[3] + st[2]);
      const wob = Math.sin(t * 0.9 + st[1] * 0.3) * 0.8;
      const x = Math.floor(st[0] + wob), y = Math.floor(st[1]);
      const a = 40 + 200 * tw * tw;
      blend(x, y, 0xEAF0FF, a);
      if (st[4] && tw > 0.6) {
        const a2 = a * 0.35;
        blend(x - 1, y, 0xEAF0FF, a2); blend(x + 1, y, 0xEAF0FF, a2);
        blend(x, y - 1, 0xEAF0FF, a2); blend(x, y + 1, 0xEAF0FF, a2);
      }
    }
    const mx = W * 0.68, my = H * 0.2;
    fillCircle(mx, my, 12, 0xB8C8E8, 14);
    for (let dy = -5; dy <= 5; dy++) {
      const half = Math.sqrt(Math.max(0, 30 - dy * dy)) * 1.2;
      const shift = Math.sin(t * 1.1 + dy * 0.8) * 0.8;
      for (let dx = Math.trunc(-half); dx <= Math.trunc(half); dx++) {
        const br = Math.sin(t * 1.6 + dx * 0.5 + dy * 1.3);
        if (br < -0.6) continue;
        blend(mx + dx + shift, my + dy, 0xF1F3E2, 150 + 60 * br);
      }
    }
    for (let dy = 7; dy < 40; dy += 2) {
      const fade = 1 - (dy - 7) / 33;
      const half = 2.5 + 3 * fade + Math.sin(t * 2 + dy) * 1.5;
      const shift = Math.sin(t * 0.9 + dy * 0.4) * 2;
      for (let dx = Math.trunc(-half); dx <= Math.trunc(half); dx++) {
        const br = Math.sin(t * 2.4 + dx * 1.1 + dy * 0.7);
        if (br < 0) continue;
        blend(mx + dx + shift, my + dy, 0xE6EBDA, 130 * fade * br);
      }
    }
  }

  function drawKoi(k, shadow) {
    const sz = k.size, night = prefs.water === NIGHT;
    if (shadow) {
      for (let j = SEGS - 1; j >= 0; j--) fillCircle(k.x[j] + 2.5, k.y[j] + 3.5, PROFILE[j] * sz, 0x000000, night ? 30 : 55);
      return;
    }
    const dimTo = 0x0C1630, dim = night ? 110 : 0;
    // tail fin
    const tl = SEGS - 1;
    let tx = k.x[tl] - k.x[tl - 1], ty = k.y[tl] - k.y[tl - 1];
    const tlen = Math.hypot(tx, ty);
    if (tlen > 0.01) {
      tx /= tlen; ty /= tlen;
      const sway = Math.sin(k.phase) * 1.2;
      const ex = k.x[tl] + tx * 3 * sz, ey = k.y[tl] + ty * 3 * sz;
      const fin = mix(mix(k.colors[tl], 0xFFFFFF, 90), dimTo, dim);
      line(k.x[tl], k.y[tl], ex - ty * (1.8 + sway) * sz, ey + tx * (1.8 + sway) * sz, fin, 170);
      line(k.x[tl], k.y[tl], ex + ty * (1.8 - sway) * sz, ey - tx * (1.8 - sway) * sz, fin, 170);
    }
    // pectoral fins
    let fx = k.x[1] - k.x[2], fy = k.y[1] - k.y[2];
    const fl = Math.hypot(fx, fy);
    if (fl > 0.01) {
      fx /= fl; fy /= fl;
      const flap = 0.6 + 0.4 * Math.sin(k.phase * 1.3);
      const o = PROFILE[2] * sz + 1.2 * flap;
      const fin = mix(mix(k.colors[2], 0xFFFFFF, 110), dimTo, dim);
      fillCircle(k.x[2] - fy * o - fx, k.y[2] + fx * o - fy, 0.9 * sz, fin, 150);
      fillCircle(k.x[2] + fy * o - fx, k.y[2] - fx * o - fy, 0.9 * sz, fin, 150);
    }
    // body
    for (let j = SEGS - 1; j >= 0; j--) fillCircle(k.x[j], k.y[j], PROFILE[j] * sz, mix(k.colors[j], dimTo, dim), 255);
    // sheen along the back
    for (let j = 1; j < 5; j++) blend(k.x[j], k.y[j], 0xFFFFFF, night ? 25 : 45);
  }

  function drawPad(p, shadow) {
    const night = prefs.water === NIGHT;
    const dimTo = 0x050A14, dim = night ? 130 : 0;
    const x0 = Math.floor(p.x - p.r - 1), x1 = Math.floor(p.x + p.r + 1);
    const y0 = Math.floor(p.y - p.r - 1), y1 = Math.floor(p.y + p.r + 1);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x + 0.5 - p.x, dy = (y + 0.5 - p.y) / 0.85;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > p.r) continue;
        const a = Math.atan2(dy, dx);
        if (Math.abs(wrap(a - p.notch)) < 0.32 && d > 0.8) continue;
        if (shadow) { blend(x + 2, y + 2, 0x000000, 70); continue; }
        let c = PAD;
        if (d > p.r - 1.1) c = PAD_DARK;
        else if (dx + dy < -p.r * 0.5) c = PAD_LIGHT;
        if (d > 1.5 && d < p.r - 1.5) {
          const va = ((a - p.notch) * 7) / 6.2832;
          if (Math.abs(va - Math.round(va)) < 0.07) c = mix(c, PAD_LIGHT, 110);
        }
        set(x, y, mix(c, dimTo, dim));
      }
    }
    if (!shadow && p.flower) {
      const fx = Math.floor(p.x - p.r * 0.2), fy = Math.floor(p.y - p.r * 0.15);
      let pink = 0xF0A3BF, light = 0xFFD9E6, deep = 0xD9779C;
      if (night) { pink = mix(pink, dimTo, 90); light = mix(light, dimTo, 70); deep = mix(deep, dimTo, 90); }
      for (const [ox, oy] of [[-1, -1], [1, -1], [-2, 0], [2, 0], [-1, 1], [1, 1], [0, -2], [0, 1]]) set(fx + ox, fy + oy, pink);
      set(fx - 1, fy - 2, light); set(fx + 1, fy - 2, light);
      set(fx - 2, fy + 1, deep); set(fx + 2, fy + 1, deep);
      set(fx, fy, 0xF6D45A); set(fx, fy - 1, 0xF6D45A);
    }
  }

  function render() {
    const night = prefs.water === NIGHT;
    const wthr = currentWeather();
    drawWater();
    if (wthr === "rain") for (let i = 0; i < W * H; i++) px[i] = mix(px[i], 0x0A1A22, 45);
    if (wthr === "snow") for (let i = 0; i < W * H; i++) px[i] = mix(px[i], 0xA8B8C8, 22);
    if (night) drawNightSky();
    for (const k of koi) drawKoi(k, true);
    for (const k of koi) drawKoi(k, false);
    drawFloating(night);
    const pc = night ? mix(PELLET, 0x0A1226, 90) : PELLET;
    pellets.forEach((p) => {
      const a = p.age > 40 ? (255 * (45 - p.age)) / 5 : 255;
      blend(p.x, p.y + 1, WATERS[prefs.water].c[0], a / 3);
      blend(p.x, p.y, pc, a);
      if ((Math.floor(t * 2 + p.x) % 3) === 0) blend(p.x, p.y, PELLET_LIGHT, (a * (night ? 2 : 3)) / 3);
    });
    const rc = night ? 0x9FB4D9 : 0xBFE3D6;
    for (const r of ripples) {
      const f = 1 - r.life / r.max;
      if (r.r > 0) ring(r.x, r.y, r.r, rc, r.alpha * f * f * (night ? 0.8 : 1));
    }
    if (frog.state === 1) drawFrog(night); // eyes peeking out of the water, under the pads
    for (const p of pads) drawPad(p, true);
    for (const p of pads) drawPad(p, false);
    if (frog.state > 1) drawFrog(night);
    for (const s of splashes) blend(s.x, s.y, 0xD8ECF0, 200);
    drawFalling(night);
    drawFly(night);
    if (night) {
      for (const f of flies) {
        const glow = 0.5 + 0.5 * Math.sin(t * 1.7 + f[2] * 3);
        fillCircle(f[0], f[1], 2.2, 0xD8F07A, 35 * glow);
        blend(f[0], f[1], 0xF2FFB0, 60 + 195 * glow);
      }
    }
    // pixel buffer -> canvas (ImageData is RGBA bytes; on little-endian that's 0xAABBGGRR)
    for (let i = 0, n = W * H; i < n; i++) {
      const c = px[i];
      out32[i] = 0xFF000000 | ((c & 255) << 16) | (c & 0xFF00) | ((c >> 16) & 255);
    }
    ctx.putImageData(img, 0, 0);
  }

  // ---------------- UI ----------------
  const body = document.body;
  const foodBtn = document.getElementById("foodBtn");
  const settingsBtn = document.getElementById("settingsBtn");
  const panel = document.getElementById("panel");
  const toast = document.getElementById("toast");
  const hint = document.getElementById("hint");
  let idleTimer = 0, toastTimer = 0;

  function wake() {
    body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (panel.hidden) body.classList.add("idle"); }, 4000);
  }
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);
  }
  function toggleFood() {
    food = !food;
    foodBtn.setAttribute("aria-pressed", String(food));
    say(food ? "food on" : "food off");
    wake();
  }
  function openPanel(open) {
    panel.hidden = !open;
    settingsBtn.setAttribute("aria-expanded", String(open));
    if (open) {
      showPainter(false);
      document.getElementById("volume").focus({ preventScroll: true });
    }
    wake();
  }

  // ---------------- paint my koi ----------------
  const mainView = document.getElementById("mainView");
  const paintView = document.getElementById("paintView");
  const panelTitle = document.getElementById("panelTitle");
  const pcv = document.getElementById("painterCanvas");
  const pctx = pcv.getContext("2d");
  const PW = pcv.width, PH = pcv.height;
  const pimg = pctx.createImageData(PW, PH);
  const pout = new Uint32Array(pimg.data.buffer);
  const prevCv = document.getElementById("paintPreview");
  const prevCtx = prevCv.getContext("2d");
  const swatchBox = document.getElementById("swatches");
  const partName = document.getElementById("partName");
  let part = 0;

  // section centres for the big koi (head on the left)
  const segX = (j) => 11 + j * 6.4;
  const segY = (j) => 15 + Math.sin(t * 1.5 - j * 0.6) * j * 0.18;
  const segR = (j) => PROFILE[j] * 2.6;

  function drawKoiInto(buf, w, h, ox, oy, step, rad, sway, sel) {
    // tiny local rasterizer so the painter can share the pond's look
    const put = (x, y, c, a) => {
      x = Math.floor(x); y = Math.floor(y);
      if (x < 0 || y < 0 || x >= w || y >= h) return;
      const i = y * w + x;
      buf[i] = a >= 255 ? c : mix(buf[i], c, a | 0);
    };
    const disc = (cx, cy, r, c, a) => {
      for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
        for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
          const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
          if (dx * dx + dy * dy <= r * r) put(x, y, c, a);
        }
    };
    const pat = customPattern();
    const sx = (j) => ox + j * step, sy = (j) => oy + (sway ? Math.sin(t * 1.5 - j * 0.6) * j * 0.18 : 0);
    const tx = sx(7), ty = sy(7);
    const fin = mix(pat[7], 0xFFFFFF, 90);
    for (let k = 0; k <= 8; k++) {
      const ex = tx + rad * 3.2, ey = ty - rad * 2.4 + (k * rad * 4.8) / 8;
      const n = Math.ceil(Math.max(Math.abs(ex - tx), Math.abs(ey - ty)) * 2);
      for (let i = 0; i <= n; i++) put(tx + ((ex - tx) * i) / n, ty + ((ey - ty) * i) / n, fin, 200);
    }
    const pf = mix(pat[2], 0xFFFFFF, 110);
    disc(sx(2) - rad * 0.5, sy(2) - PROFILE[2] * rad - rad * 0.8, rad * 0.9, pf, 190);
    disc(sx(2) - rad * 0.5, sy(2) + PROFILE[2] * rad + rad * 0.8, rad * 0.9, pf, 190);
    for (let j = 7; j >= 0; j--) disc(sx(j), sy(j), PROFILE[j] * rad, pat[j], 255);
    for (let j = 1; j < 5; j++) put(sx(j), sy(j) - PROFILE[j] * rad * 0.5, 0xFFFFFF, 60);
    if (sel >= 0) {
      const r = PROFILE[sel] * rad + 1.2, pulse = 0.55 + 0.45 * Math.sin(t * 5);
      for (let i = 0; i < 40; i++) {
        const a = (i / 40) * Math.PI * 2;
        put(sx(sel) + Math.cos(a) * r, sy(sel) + Math.sin(a) * r, 0xFFFFFF, 210 * pulse);
      }
    }
  }

  const pbuf = new Int32Array(PW * PH), prevBuf = new Int32Array(prevCv.width * prevCv.height);
  const prevImg = prevCtx.createImageData(prevCv.width, prevCv.height);
  const prevOut = new Uint32Array(prevImg.data.buffer);
  function blit(buf, out32, ctx2, im) {
    for (let i = 0; i < buf.length; i++) {
      const c = buf[i];
      out32[i] = 0xFF000000 | ((c & 255) << 16) | (c & 0xFF00) | ((c >> 16) & 255);
    }
    ctx2.putImageData(im, 0, 0);
  }
  function renderPainter() {
    const pal = WATERS[prefs.water].c;
    for (let y = 0; y < PH; y++)
      for (let x = 0; x < PW; x++) {
        let i = (((Math.sin(x * 0.4 + t * 0.6) + Math.sin(y * 0.5 - t * 0.4)) * 0.35 + 2.4 + dither(x, y) - 0.5) | 0);
        pbuf[y * PW + x] = pal[clamp(i, 0, pal.length - 1)];
      }
    drawKoiInto(pbuf, PW, PH, 11, 15, 6.4, 2.6, true, part);
    blit(pbuf, pout, pctx, pimg);
  }
  function renderPreview() {
    const pw = prevCv.width, ph = prevCv.height, pal = WATERS[prefs.water].c;
    prevBuf.fill(pal[2]);
    drawKoiInto(prevBuf, pw, ph, 5, 6, 3.3, 1.25, false, -1);
    blit(prevBuf, prevOut, prevCtx, prevImg);
  }

  PALETTE.forEach(([c, name], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.style.background = "#" + c.toString(16).padStart(6, "0");
    b.setAttribute("aria-label", name);
    b.title = name;
    b.addEventListener("click", () => paint(i));
    swatchBox.append(b);
  });

  function refreshPainter() {
    partName.textContent = PART_NAMES[part];
    [...swatchBox.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === prefs.custom[part])));
    renderPreview();
  }
  function paint(i) {
    prefs.custom[part] = i;
    // painting means you want to see your koi: switch the pond to include it
    if (prefs.colors !== "mix" && prefs.colors !== "custom") prefs.colors = "mix";
    syncKoi();
    savePrefs();
    refreshPainter();
    colors.value = prefs.colors;
  }
  function showPainter(on) {
    paintView.hidden = !on;
    mainView.hidden = on;
    panelTitle.textContent = on ? "paint my koi" : "pond";
    if (on) { refreshPainter(); renderPainter(); swatchBox.children[prefs.custom[part]].focus({ preventScroll: true }); }
    else renderPreview();
  }
  document.getElementById("paintOpen").addEventListener("click", () => showPainter(true));
  document.getElementById("paintDone").addEventListener("click", () => {
    showPainter(false);
    document.getElementById("paintOpen").focus({ preventScroll: true });
  });
  document.getElementById("paintReset").addEventListener("click", () => {
    prefs.custom = CUSTOM_DEFAULT.slice();
    syncKoi(); savePrefs(); refreshPainter();
  });
  document.getElementById("partPrev").addEventListener("click", () => { part = (part + 7) % 8; refreshPainter(); });
  document.getElementById("partNext").addEventListener("click", () => { part = (part + 1) % 8; refreshPainter(); });
  pcv.addEventListener("pointerdown", (e) => {
    const r = pcv.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * PW, y = ((e.clientY - r.top) / r.height) * PH;
    let best = -1, bd = 1e9;
    for (let j = 0; j < 8; j++) {
      const d = Math.hypot(x - segX(j), y - segY(j));
      if (d < Math.max(4, segR(j) + 2) && d < bd) { bd = d; best = j; }
    }
    if (best < 0 && x > segX(7)) best = 7; // the tail fin counts as the tail
    if (best < 0) return;
    if (best === part) paint((prefs.custom[part] + 1) % PALETTE.length); // tap again to cycle colors
    part = best;
    refreshPainter();
  });
  let hintShown = true;
  function dismissHint() {
    if (!hintShown) return;
    hintShown = false;
    hint.classList.add("gone");
  }
  setTimeout(dismissHint, 9000);

  foodBtn.addEventListener("click", toggleFood);
  const soundBtn = document.getElementById("soundBtn");
  soundBtn.addEventListener("click", () => { setSound(!prefs.sound); say(prefs.sound ? "sound on" : "sound off"); wake(); });
  soundBtn.setAttribute("aria-pressed", String(!!prefs.sound));
  soundBtn.setAttribute("aria-label", prefs.sound ? "Sound off" : "Sound on");
  const volume = document.getElementById("volume"), volumeOut = document.getElementById("volumeOut");
  volume.addEventListener("input", () => {
    prefs.volume = +volume.value; volumeOut.textContent = volume.value; savePrefs(); applyVolume();
    if (!prefs.sound) setSound(1);
    sfx.plip();
  });

  // ---------------- full screen ----------------
  const fsBtn = document.getElementById("fsBtn");
  const root = document.documentElement;
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  const canFullscreen = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) &&
    !!(root.requestFullscreen || root.webkitRequestFullscreen);
  fsBtn.hidden = !canFullscreen; // e.g. iPhone Safari has no full screen for web pages
  function syncFullscreen() {
    const on = !!fsElement();
    fsBtn.setAttribute("aria-pressed", String(on));
    fsBtn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
  }
  function toggleFullscreen() {
    wake();
    try {
      if (fsElement()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        const r = (root.requestFullscreen || root.webkitRequestFullscreen).call(root, { navigationUI: "hide" });
        if (r && r.catch) r.catch(() => say("full screen isn't available here"));
      }
    } catch (e) {
      say("full screen isn't available here");
    }
  }
  fsBtn.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", syncFullscreen);
  document.addEventListener("webkitfullscreenchange", syncFullscreen);
  settingsBtn.addEventListener("click", () => openPanel(panel.hidden));
  document.getElementById("closeBtn").addEventListener("click", () => { openPanel(false); settingsBtn.focus(); });

  // settings controls
  const count = document.getElementById("count"), countOut = document.getElementById("countOut");
  const speed = document.getElementById("speed"), speedOut = document.getElementById("speedOut");
  const colors = document.getElementById("colors");
  const waterGroup = document.getElementById("water"), padsGroup = document.getElementById("pads");

  WATERS.forEach((w, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.type = "button";
    const sw = document.createElement("div");
    sw.className = "swatch";
    const hex = (c) => "#" + c.toString(16).padStart(6, "0");
    sw.style.background = `linear-gradient(180deg, ${hex(w.c[4])}, ${hex(w.c[2])} 60%, ${hex(w.c[0])})`;
    b.append(sw, document.createTextNode(w.name));
    b.addEventListener("click", () => { prefs.water = i; savePrefs(); refreshControls(); });
    waterGroup.append(b);
  });
  const weatherGroup = document.getElementById("weather"), weatherNow = document.getElementById("weatherNow");
  const visitorsGroup = document.getElementById("visitors");
  WEATHERS.forEach(([key, name]) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.type = "button";
    b.textContent = name;
    b.dataset.key = key;
    b.addEventListener("click", () => { prefs.weather = key; drift = []; savePrefs(); refreshControls(); });
    weatherGroup.append(b);
  });
  ["off", "on"].forEach((name, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.type = "button";
    b.textContent = name;
    b.addEventListener("click", () => { prefs.visitors = i; savePrefs(); refreshControls(); });
    visitorsGroup.append(b);
  });
  PAD_MODES.forEach((name, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.type = "button";
    b.textContent = name;
    b.addEventListener("click", () => { prefs.pads = i; savePrefs(); buildPads(); refreshControls(); });
    padsGroup.append(b);
  });

  function refreshControls() {
    count.value = prefs.count; countOut.textContent = prefs.count;
    volume.value = prefs.volume; volumeOut.textContent = prefs.volume;
    speed.value = prefs.speed; speedOut.textContent = prefs.speed;
    colors.value = String(prefs.colors);
    [...waterGroup.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === prefs.water)));
    [...padsGroup.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === prefs.pads)));
    [...weatherGroup.children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.key === prefs.weather)));
    [...visitorsGroup.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === (prefs.visitors ? 1 : 0))));
    weatherNow.textContent = prefs.weather === "season" ? "now: " + currentWeather() : "";
    renderPreview();
  }
  count.addEventListener("input", () => { prefs.count = +count.value; countOut.textContent = count.value; syncKoi(); savePrefs(); });
  speed.addEventListener("input", () => { prefs.speed = +speed.value; speedOut.textContent = speed.value; savePrefs(); });
  colors.addEventListener("change", () => { prefs.colors = colors.value; syncKoi(); savePrefs(); });

  // pond input
  let wakeLock = null;
  function keepAwake() {
    if (!("wakeLock" in navigator) || wakeLock) return;
    navigator.wakeLock.request("screen").then((l) => {
      wakeLock = l;
      l.addEventListener("release", () => { wakeLock = null; });
    }).catch(() => {});
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && keepAwake.used) keepAwake(); });

  let dragging = false;
  canvas.addEventListener("pointerdown", (e) => {
    if (prefs.sound && !soundOn()) setSound(1);
    keepAwake.used = true;
    keepAwake();
    dismissHint();
    wake();
    dragging = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const x = e.clientX / scale, y = e.clientY / scale;
    lastRippleX = x; lastRippleY = y;
    if (tapVisitor(x, y)) return;
    // a splash near the frog sends it back into the water
    if (!food && frog.state === 3 && Math.hypot(x - frog.x, y - frog.y) < 22) frogHopOff();
    if (food) { dropFood(x, y); sfx.plip(); }
    else {
      sfx.splash();
      addRipple(x, y, 1, 1.8, 170);
      addRipple(x, y, -3, 2.0, 110);
      startle(x, y, 45);
    }
  });
  canvas.addEventListener("pointermove", (e) => {
    const x = e.clientX / scale, y = e.clientY / scale;
    if (e.pointerType === "mouse") onCursorMove(x, y);
    if (e.pointerType === "mouse" && !dragging) { wake(); return; }
    if (!dragging) return;
    // dragging a finger through the water leaves a ripple trail
    if (Math.hypot(x - lastRippleX, y - lastRippleY) > 6) {
      lastRippleX = x; lastRippleY = y;
      addRipple(x, y, 1, 1.2, 110);
      if (!food) startle(x, y, 22);
    }
  });
  const endDrag = () => { dragging = false; };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("pointerleave", () => { cursor.on = false; cursor.still = 0; });

  window.addEventListener("keydown", (e) => {
    if (prefs.sound && !soundOn() && e.key !== "m" && e.key !== "M") setSound(1);
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) {
      if (e.key === "Escape") { openPanel(false); settingsBtn.focus(); }
      return;
    }
    if (e.key === "f" || e.key === "F" || (e.key === " " && e.target === document.body)) {
      e.preventDefault();
      toggleFood();
    } else if (e.key === "Enter" && e.target === document.body && canFullscreen) {
      toggleFullscreen();
    } else if (e.key === "m" || e.key === "M") {
      setSound(!prefs.sound);
      say(prefs.sound ? "sound on" : "sound off");
      wake();
    } else if (e.key === "s" || e.key === "S") {
      openPanel(panel.hidden);
    } else if (e.key === "Escape" && !panel.hidden) {
      openPanel(false);
      settingsBtn.focus();
    } else {
      wake();
    }
  });

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 120);
  });

  // ---------------- go ----------------
  layout();
  refreshControls();
  wake();
  for (let i = 0; i < 60; i++) update(1 / 30); // let the fish spread out before the first frame
  render();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    if (!panel.hidden && !paintView.hidden) renderPainter();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
